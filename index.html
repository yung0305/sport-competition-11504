<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合賽事活動控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 確保 iframe 滿版顯示且無邊框 */
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-slate-100 overflow-hidden font-sans">

  <nav class="bg-slate-900 text-white shadow-md z-10 flex-shrink-0">
    <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center gap-6">
          <div class="font-bold text-xl tracking-wider flex items-center gap-2 text-yellow-400">
            <span>🏆</span> 綜合賽事控制台
          </div>
          
          <div class="flex items-baseline space-x-2">
            <button onclick="switchSystem('Match Schedule/籃球賽程圖.html', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition-all shadow-sm">
              🏀 籃球賽程系統
            </button>
            <button onclick="switchSystem('score board/index.html', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-700 hover:text-white transition-all">
              📊 戰績計分板
            </button>
            <button onclick="switchSystem('countdown timer/index.html', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-700 hover:text-white transition-all">
              ⏱️ 倒數計時器
            </button>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <main class="flex-1 relative bg-white">
    <iframe id="system-frame" src="Match Schedule/籃球賽程圖.html" title="系統畫面"></iframe>
  </main>

  <script>
    // 切換系統的邏輯
    function switchSystem(url, clickedBtn) {
      // 1. 更改 iframe 的網址
      const frame = document.getElementById('system-frame');
      frame.src = url;
      
      // 2. 重置所有按鈕的樣式
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
        btn.classList.add('text-slate-300', 'hover:bg-slate-700', 'hover:text-white');
      });
      
      // 3. 亮起目前點擊的按鈕
      clickedBtn.classList.remove('text-slate-300', 'hover:bg-slate-700', 'hover:text-white');
      clickedBtn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ja" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Countdown Timer</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.2; }
      100% { transform: scale(1); opacity: 0.6; }
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-3px, -2px); }
      20% { transform: translate(3px, 2px); }
      30% { transform: translate(-2px, 3px); }
      40% { transform: translate(2px, -3px); }
      50% { transform: translate(-3px, 2px); }
      60% { transform: translate(3px, -2px); }
      70% { transform: translate(-2px, -3px); }
      80% { transform: translate(2px, 3px); }
      90% { transform: translate(-3px, -2px); }
    }
    @keyframes flash-border {
      0%, 100% { border-color: rgba(220, 38, 38, 0.0); }
      50% { border-color: rgba(220, 38, 38, 0.8); }
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes finished-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .animate-fade-in { animation: fade-in-up 0.6s ease-out both; }
    .timer-urgent .timer-display { animation: shake 0.4s ease-in-out infinite; }
    .timer-urgent .timer-ring { animation: pulse-ring 0.8s ease-in-out infinite; }
    .timer-urgent .flash-border-el { animation: flash-border 0.5s ease-in-out infinite; }
    .timer-finished .timer-display { animation: finished-pulse 1.2s ease-in-out infinite; }
    .breathe { animation: breathe 4s ease-in-out infinite; }

    /* Circular progress */
    .progress-circle {
      transition: stroke-dashoffset 0.3s linear;
    }

    /* Custom range slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      width: 100%;
    }
    input[type="range"]::-webkit-slider-track {
      height: 4px;
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-top: -7px;
      border: 2px solid;
    }
    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 2px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid;
    }
    
    /* Editable title styling */
    #title-text:focus {
        outline: none;
        border-bottom: 1px dashed #c4a882;
        opacity: 0.8;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app-wrapper" class="h-full w-full overflow-auto flex items-center justify-center" style="background: #0f0f14; font-family: 'Zen Kaku Gothic New', sans-serif;">
   <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="breathe absolute top-1/4 left-8 text-lg opacity-15" style="color: #c4a882; animation-delay: 1s;">
     ∙
    </div>
   </div>
   <main class="relative z-10 flex flex-col items-center w-full max-w-md px-6 py-8" role="main">
    <h1 id="title-text" contenteditable="true" spellcheck="false" class="text-lg tracking-widest mb-10 animate-fade-in cursor-text" style="color: #c4a882; font-family: 'Zen Kaku Gothic New', sans-serif; transition: 0.2s;">倒數計時</h1>
    
    <div id="timer-container" class="relative flex items-center justify-center mb-10" style="width: 280px; height: 280px;">
     <svg class="absolute inset-0" width="280" height="280" viewbox="0 0 280 280">
      <circle cx="140" cy="140" r="124" fill="none" stroke="#1a1a24" stroke-width="2" /> <circle id="timer-ring" class="timer-ring progress-circle" cx="140" cy="140" r="124" fill="none" stroke="#c4a882" stroke-width="2" stroke-linecap="round" stroke-dasharray="779.2" stroke-dashoffset="0" transform="rotate(-90 140 140)" />
     </svg>
     <div id="urgent-ring" class="timer-ring absolute rounded-full border-4 border-transparent flash-border-el" style="width: 260px; height: 260px; transition: border-color 0.3s;"></div>
     <div class="timer-display flex flex-col items-center justify-center">
      <span id="timer-display" class="tabular-nums" style="font-family: 'DM Mono', monospace; font-size: 72px; color: #e8e0d4; letter-spacing: 2px; line-height: 1;"> 00:00 </span> <span id="timer-label" class="mt-2 text-xs tracking-widest uppercase" style="color: #5a5a6a;">秒読み</span>
     </div>
    </div>
    
    <div id="setup-panel" class="w-full animate-fade-in" style="animation-delay: 0.2s;">
     <div class="mb-4">
      <div class="flex justify-between items-center mb-2">
       <label for="minutes-slider" class="text-xs tracking-widest" style="color: #5a5a6a;">分鐘 MINUTES</label> <span id="minutes-value" class="text-sm" style="color: #c4a882; font-family: 'DM Mono', monospace;">0</span>
      </div><input type="range" id="minutes-slider" min="0" max="20" value="0" style="--track-bg: #1a1a24; --thumb-bg: #c4a882; --thumb-border: #c4a882;">
     </div>
     <div class="mb-8">
      <div class="flex justify-between items-center mb-2">
       <label for="seconds-slider" class="text-xs tracking-widest" style="color: #5a5a6a;">秒 SECONDS</label> <span id="seconds-value" class="text-sm" style="color: #c4a882; font-family: 'DM Mono', monospace;">30</span>
      </div><input type="range" id="seconds-slider" min="0" max="59" value="30" style="--track-bg: #1a1a24; --thumb-bg: #c4a882; --thumb-border: #c4a882;">
     </div>
     <button id="start-btn" class="w-full py-4 rounded-lg text-sm tracking-widest uppercase transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]" style="background: #c4a882; color: #0f0f14; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700;"> 開始 </button>
    </div>
    
    <div id="control-panel" class="w-full hidden">
     <div class="flex gap-3">
      <button id="pause-btn" class="flex-1 py-4 rounded-lg text-sm tracking-widest uppercase transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]" style="background: #1a1a24; color: #c4a882; border: 1px solid #2a2a34; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700;"> 暫停 </button> <button id="reset-btn" class="flex-1 py-4 rounded-lg text-sm tracking-widest uppercase transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]" style="background: #1a1a24; color: #5a5a6a; border: 1px solid #2a2a34; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700;"> 重設 </button>
     </div>
    </div>
    
    <div id="finished-msg" class="hidden text-center mt-6">
     <p class="text-2xl tracking-widest" style="color: #dc2626; font-family: 'Zen Kaku Gothic New', sans-serif;">時間到 ─ TIME'S UP</p>
    </div>
   </main>
  </div>
  
  <script>
    // === State ===
    let totalSeconds = 30;
    let remainingMs = 30000;
    let timerInterval = null;
    let isRunning = false;
    let isPaused = false;
    let lastTickTime = null;

    // === Audio Elements ===
    const bgmNormal = new Audio('倒數音樂(不含十秒).mp3');
    bgmNormal.loop = true; // 設定為循環播放，以免計時器太長時音樂播完
    const bgmUrgent = new Audio('倒數十秒.mp3');
    let urgentStarted = false; // 用來記錄是否已經開始播放最後十秒音效

    // === DOM refs ===
    const timerDisplay = document.getElementById('timer-display');
    const timerLabel = document.getElementById('timer-label');
    const timerRing = document.getElementById('timer-ring');
    const timerContainer = document.getElementById('timer-container');
    const urgentRing = document.getElementById('urgent-ring');
    const setupPanel = document.getElementById('setup-panel');
    const controlPanel = document.getElementById('control-panel');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');
    const minutesSlider = document.getElementById('minutes-slider');
    const secondsSlider = document.getElementById('seconds-slider');
    const minutesValue = document.getElementById('minutes-value');
    const secondsValue = document.getElementById('seconds-value');
    const finishedMsg = document.getElementById('finished-msg');
    const titleEl = document.getElementById('title-text');
    const appWrapper = document.getElementById('app-wrapper');

    const CIRCUMFERENCE = 2 * Math.PI * 124;

    // === Slider styling ===
    function styleSliders(trackBg, thumbBg) {
      const css = `
        input[type="range"]::-webkit-slider-track { background: ${trackBg}; }
        input[type="range"]::-webkit-slider-thumb { background: ${thumbBg}; border-color: ${thumbBg}; }
        input[type="range"]::-moz-range-track { background: ${trackBg}; }
        input[type="range"]::-moz-range-thumb { background: ${thumbBg}; border-color: ${thumbBg}; }
      `;
      let el = document.getElementById('slider-styles');
      if (!el) { el = document.createElement('style'); el.id = 'slider-styles'; document.head.appendChild(el); }
      el.textContent = css;
    }
    styleSliders('#1a1a24', '#c4a882');

    // === Format time ===
    function formatTime(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // === Update display ===
    function updateDisplay() {
      const secLeft = Math.ceil(remainingMs / 1000);
      timerDisplay.textContent = formatTime(remainingMs);

      // Progress ring
      const progress = totalSeconds > 0 ? (1 - remainingMs / (totalSeconds * 1000)) : 0;
      timerRing.style.strokeDashoffset = progress * CIRCUMFERENCE;

      // Urgent mode (last 10 seconds)
      if (isRunning && !isPaused && secLeft <= 10 && secLeft > 0) {
        timerContainer.classList.add('timer-urgent');
        timerRing.style.stroke = '#dc2626';
        timerDisplay.style.color = '#dc2626';
        timerLabel.textContent = '最後衝刺';
        timerLabel.style.color = '#dc2626';
        // Scale up the number as time runs out
        const scale = 1 + (1 - secLeft / 10) * 0.3;
        timerDisplay.style.transform = `scale(${scale})`;
      } else if (secLeft <= 0 && isRunning) {
        // finished handled in interval
      } else {
        timerContainer.classList.remove('timer-urgent');
        timerContainer.classList.remove('timer-finished');
        timerRing.style.stroke = '#c4a882';
        timerDisplay.style.color = '#e8e0d4';
        timerDisplay.style.transform = 'scale(1)';
        timerLabel.style.color = '#5a5a6a';
        if (isPaused) {
          timerLabel.textContent = '已暫停';
        } else if (isRunning) {
          timerLabel.textContent = '進行中';
        } else {
          timerLabel.textContent = '準備中';
        }
      }
    }

    // === Slider events ===
    function updatePreview() {
      const m = parseInt(minutesSlider.value);
      const s = parseInt(secondsSlider.value);
      minutesValue.textContent = m;
      secondsValue.textContent = s;
      totalSeconds = m * 60 + s;
      remainingMs = totalSeconds * 1000;
      updateDisplay();
      startBtn.disabled = totalSeconds === 0;
      startBtn.style.opacity = totalSeconds === 0 ? '0.4' : '1';
      startBtn.style.cursor = totalSeconds === 0 ? 'not-allowed' : 'pointer';
    }

    minutesSlider.addEventListener('input', updatePreview);
    secondsSlider.addEventListener('input', updatePreview);

    // === Timer logic ===
    function startTimer() {
      if (totalSeconds === 0) return;
      
      isRunning = true;
      isPaused = false;
      urgentStarted = false; // 重置音樂切換旗標
      
      // 初始化音樂播放時間並開始播放對應音樂
      bgmNormal.currentTime = 0;
      bgmUrgent.currentTime = 0;
      const secLeft = Math.ceil(remainingMs / 1000);
      if (secLeft > 10) {
          bgmNormal.play().catch(e => console.log("Audio play blocked by browser:", e));
      } else {
          bgmUrgent.play().catch(e => console.log("Audio play blocked by browser:", e));
          urgentStarted = true;
      }

      setupPanel.classList.add('hidden');
      controlPanel.classList.remove('hidden');
      finishedMsg.classList.add('hidden');
      timerContainer.classList.remove('timer-finished');
      pauseBtn.textContent = '暫停';
      lastTickTime = Date.now();

      timerInterval = setInterval(() => {
        const now = Date.now();
        const delta = now - lastTickTime;
        lastTickTime = now;
        remainingMs -= delta;

        const currentSecLeft = Math.ceil(remainingMs / 1000);

        // 最後10秒的音樂切換邏輯
        if (currentSecLeft <= 10 && currentSecLeft > 0 && !urgentStarted) {
            bgmNormal.pause(); // 停掉原本的音樂
            bgmUrgent.currentTime = 0; // 確保最後十秒音樂從頭開始
            bgmUrgent.play().catch(e => console.log("Audio play blocked:", e));
            urgentStarted = true;
        }

        if (remainingMs <= 0) {
          remainingMs = 0;
          
          // 時間到，暫停所有音樂
          bgmNormal.pause();
          bgmUrgent.pause();

          clearInterval(timerInterval);
          timerInterval = null;
          isRunning = false;
          timerContainer.classList.remove('timer-urgent');
          timerContainer.classList.add('timer-finished');
          timerDisplay.textContent = '00:00';
          timerDisplay.style.color = '#dc2626';
          timerDisplay.style.transform = 'scale(1.3)';
          timerLabel.textContent = '完成';
          timerLabel.style.color = '#dc2626';
          timerRing.style.strokeDashoffset = CIRCUMFERENCE;
          timerRing.style.stroke = '#dc2626';
          finishedMsg.classList.remove('hidden');
          
          // Flash background
          appWrapper.style.transition = 'background 0.3s';
          appWrapper.style.background = '#1a0a0a';
          setTimeout(() => { appWrapper.style.background = '#0f0f14'; }, 300);
          setTimeout(() => { appWrapper.style.background = '#1a0a0a'; }, 600);
          setTimeout(() => { appWrapper.style.background = '#0f0f14'; }, 900);
          return;
        }
        updateDisplay();
      }, 50);

      updateDisplay();
    }

    function togglePause() {
      if (!isRunning) return;
      const secLeft = Math.ceil(remainingMs / 1000);

      if (isPaused) {
        // 從暫停恢復進行
        isPaused = false;
        
        // 恢復播放音樂
        if (secLeft > 10) {
            bgmNormal.play().catch(e => console.log("Play error:", e));
        } else {
            bgmUrgent.play().catch(e => console.log("Play error:", e));
        }

        lastTickTime = Date.now();
        timerInterval = setInterval(() => {
          const now = Date.now();
          const delta = now - lastTickTime;
          lastTickTime = now;
          remainingMs -= delta;
          
          const currentSecLeft = Math.ceil(remainingMs / 1000);

          // 恢復進行時的最後10秒音樂切換邏輯
          if (currentSecLeft <= 10 && currentSecLeft > 0 && !urgentStarted) {
              bgmNormal.pause();
              bgmUrgent.currentTime = 0;
              bgmUrgent.play().catch(e => console.log("Play error:", e));
              urgentStarted = true;
          }

          if (remainingMs <= 0) {
            remainingMs = 0;
            bgmNormal.pause();
            bgmUrgent.pause();

            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            timerContainer.classList.remove('timer-urgent');
            timerContainer.classList.add('timer-finished');
            timerDisplay.textContent = '00:00';
            timerDisplay.style.color = '#dc2626';
            timerDisplay.style.transform = 'scale(1.3)';
            timerLabel.textContent = '完成';
            timerLabel.style.color = '#dc2626';
            timerRing.style.strokeDashoffset = CIRCUMFERENCE;
            timerRing.style.stroke = '#dc2626';
            finishedMsg.classList.remove('hidden');
            return;
          }
          updateDisplay();
        }, 50);
        pauseBtn.textContent = '暫停';
      } else {
        // 按下暫停
        isPaused = true;
        
        // 暫停所有音樂
        bgmNormal.pause();
        bgmUrgent.pause();

        clearInterval(timerInterval);
        timerInterval = null;
        pauseBtn.textContent = '繼續';
      }
      updateDisplay();
    }

    function resetTimer() {
      // 暫停並重置音樂
      bgmNormal.pause();
      bgmNormal.currentTime = 0;
      bgmUrgent.pause();
      bgmUrgent.currentTime = 0;
      urgentStarted = false;

      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      isPaused = false;
      timerContainer.classList.remove('timer-urgent');
      timerContainer.classList.remove('timer-finished');
      finishedMsg.classList.add('hidden');
      appWrapper.style.background = '#0f0f14';
      setupPanel.classList.remove('hidden');
      controlPanel.classList.add('hidden');
      updatePreview();
    }

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', resetTimer);

    // === Element SDK ===
    const defaultConfig = {
      title_text: '倒數計時',
      background_color: '#0f0f14',
      accent_color: '#c4a882',
      text_color: '#e8e0d4',
      surface_color: '#1a1a24',
      muted_color: '#5a5a6a',
      font_family: 'Zen Kaku Gothic New',
      font_size: 16
    };

    function applyConfig(config) {
      const bg = config.background_color || defaultConfig.background_color;
      const accent = config.accent_color || defaultConfig.accent_color;
      const text = config.text_color || defaultConfig.text_color;
      const surface = config.surface_color || defaultConfig.surface_color;
      const muted = config.muted_color || defaultConfig.muted_color;
      const font = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;

      if(config.title_text) titleEl.textContent = config.title_text;
      titleEl.style.color = accent;
      titleEl.style.fontFamily = `${font}, sans-serif`;
      titleEl.style.fontSize = `${fontSize * 1.1}px`;

      if (!isRunning || (!timerContainer.classList.contains('timer-finished'))) {
        appWrapper.style.background = bg;
      }

      const secLeft = Math.ceil(remainingMs / 1000);
      if (!(isRunning && !isPaused && secLeft <= 10) && !timerContainer.classList.contains('timer-finished')) {
        timerDisplay.style.color = text;
        timerRing.style.stroke = accent;
        timerLabel.style.color = muted;
      }

      startBtn.style.background = accent;
      startBtn.style.color = bg;
      startBtn.style.fontFamily = `${font}, sans-serif`;
      startBtn.style.fontSize = `${fontSize * 0.875}px`;

      pauseBtn.style.background = surface;
      pauseBtn.style.color = accent;
      pauseBtn.style.borderColor = surface;
      pauseBtn.style.fontFamily = `${font}, sans-serif`;
      pauseBtn.style.fontSize = `${fontSize * 0.875}px`;

      resetBtn.style.background = surface;
      resetBtn.style.color = muted;
      resetBtn.style.borderColor = surface;
      resetBtn.style.fontFamily = `${font}, sans-serif`;
      resetBtn.style.fontSize = `${fontSize * 0.875}px`;

      document.querySelectorAll('label[for]').forEach(l => {
        l.style.color = muted;
        l.style.fontFamily = `${font}, sans-serif`;
        l.style.fontSize = `${fontSize * 0.75}px`;
      });
      minutesValue.style.color = accent;
      secondsValue.style.color = accent;

      const bgCircle = timerRing.previousElementSibling;
      if (bgCircle) bgCircle.style.stroke = surface;

      styleSliders(surface, accent);

      timerDisplay.style.fontSize = `${fontSize * 4.5}px`;
      timerLabel.style.fontSize = `${fontSize * 0.75}px`;
      timerLabel.style.fontFamily = `${font}, sans-serif`;

      finishedMsg.querySelector('p').style.fontFamily = `${font}, sans-serif`;
      finishedMsg.querySelector('p').style.fontSize = `${fontSize * 1.5}px`;
    }

    if(window.elementSdk){
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            applyConfig(config);
          },
          mapToCapabilities: (config) => ({
            recolorables: [
              { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
              { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
              { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
              { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
              { get: () => config.muted_color || defaultConfig.muted_color, set: (v) => { config.muted_color = v; window.elementSdk.setConfig({ muted_color: v }); } },
            ],
            borderables: [],
            fontEditable: {
              get: () => config.font_family || defaultConfig.font_family,
              set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
            },
            fontSizeable: {
              get: () => config.font_size || defaultConfig.font_size,
              set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
            }
          }),
          mapToEditPanelValues: (config) => new Map([
            ['title_text', config.title_text || defaultConfig.title_text]
          ])
        });
    }

    titleEl.addEventListener('blur', () => {
        if(window.elementSdk) {
            window.elementSdk.setConfig({ title_text: titleEl.textContent });
        }
    });

    // Init
    updatePreview();
    lucide.createIcons();
  </script>
 </body>
</html>
